name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest numpy
      - run: python -m pytest -q
      - name: Command runs when installed
        run: |
          python -m pip install .
          midi-tempo --version

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install wxPython pyinstaller certifi numpy
      - if: runner.os == 'Windows'
        name: Inno Setup, for the installer
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: python build_app.py
      - if: runner.os == 'Windows'
        name: Install quietly, run the installed app's self-test, uninstall
        shell: pwsh
        run: |
          $p = Start-Process dist\MIDI-Tempo-Fix-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\MIDI Tempo Fix"
          if (-not (Test-Path "$app\MIDI Tempo Fix.exe")) { throw "not installed where expected" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MIDI Tempo Fix.lnk")) { throw "no Start menu entry" }
          $t = Start-Process "$app\MIDI Tempo Fix.exe" -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($t.ExitCode -ne 0) { throw "installed self-test failed" }
          $u = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          $p = Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\MIDI Tempo Fix.exe") { throw "uninstall left the app behind" }
          "Installed, self-tested and uninstalled cleanly."
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*-Setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*-Setup.exe
